<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬年奔騰</title>
    <style>
        body { text-align: center; background: #fdf5e6; margin: 0; font-family: sans-serif; overflow: hidden; }
        canvas { background: white; border-bottom: 5px solid #d32f2f; margin-top: 20px; touch-action: none; max-width: 100%; }
        #score { font-size: 30px; color: #d32f2f; margin: 10px; font-weight: bold; }
    </style>
</head>
<body onclick="handleClick()" onkeydown="handleKey(event)">

    <h1>🐎 2026 馬年奔騰</h1>
    <div id="score">分數: 0</div>
    <canvas id="gameCanvas" width="600" height="200"></canvas>
    <p>紅包變小囉！每 10 分會有煙火特效！</p>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    let imagesLoaded = 0;
    const totalImages = 2; 
    let isLooping = false; // 保險鎖

    const horseImg = new Image();
    horseImg.src = 'LS20260217032847.png';
    horseImg.onload = () => { imagesLoaded++; checkAllLoaded(); };
    horseImg.onerror = () => { imagesLoaded++; checkAllLoaded(); };

    const giftImg = new Image();
    giftImg.src = 'redpacket.png';
    giftImg.onload = () => { imagesLoaded++; checkAllLoaded(); };
    giftImg.onerror = () => { imagesLoaded++; checkAllLoaded(); };

    function checkAllLoaded() {
        if (imagesLoaded >= totalImages && !isLooping) {
            isLooping = true;
            requestAnimationFrame(loop);
        }
    }

    // 煙火粒子
    let particles = [];
    function createFirework(x, y) {
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                life: 40
            });
        }
    }

    let score = 0;
    let isGameOver = false;
    let horseY = 140;
    let horseDy = 0;
    let gravity = 0.6;
    let grounded = true;
    let obstacles = [];
    let timer = 0;
    let startSpeed = 3; 
    let speed = startSpeed;

    function doJump() {
        if (grounded) {
            horseDy = -13;
            grounded = false;
        }
    }

    function handleClick() {
        if (isGameOver) reset();
        else doJump();
    }

    function handleKey(e) {
        if (e.code === "Space") {
            e.preventDefault();
            handleClick();
        }
    }

    function reset() {
        score = 0;
        isGameOver = false;
        horseY = 140;
        horseDy = 0;
        obstacles = [];
        particles = [];
        speed = startSpeed;
        scoreEl.innerText = "分數: 0";
        if (!isLooping) {
            isLooping = true;
            requestAnimationFrame(loop);
        }
    }

    function loop() {
        if (isGameOver) {
            isLooping = false;
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 物理計算
        horseDy += gravity;
        horseY += horseDy;

        if (horseY > 140) {
            horseY = 140;
            horseDy = 0;
            grounded = true;
        }

        // 畫馬
        if (horseImg.complete && horseImg.naturalWidth !== 0) {
            ctx.drawImage(horseImg, 50, horseY, 60, 60);
        } else {
            ctx.font = "50px Arial";
            ctx.fillText("🐎", 50, horseY + 45);
        }

        // 障礙物生成
        timer++;
        if (timer > (1000 / speed)) { 
            // 隨機決定是紅包還是鞭炮
            const type = Math.random() > 0.3 ? 'gift' : 'firecracker';
            obstacles.push({ x: 600, w: 30, h: 30, type: type });
            timer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.x -= speed;
            
            // 畫障礙物
            if (o.type === 'gift') {
                if (giftImg.complete && giftImg.naturalWidth !== 0) {
                    ctx.drawImage(giftImg, o.x, 165, 30, 30); // 尺寸縮小到 30
                } else {
                    ctx.font = "30px Arial";
                    ctx.fillText("🧧", o.x, 190);
                }
            } else {
                ctx.font = "30px Arial";
                ctx.fillText("🧨", o.x, 190);
            }

            // 碰撞判定 (配合縮小的障礙物)
            if (o.x < 85 && o.x > 35 && horseY > 110) {
                isGameOver = true;
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0,0,600,200);
                ctx.fillStyle = "white";
                ctx.font = "24px Microsoft JhengHei";
                ctx.textAlign = "center";
                ctx.fillText("大吉大利，下次努力！點擊重來", 300, 100);
                return;
            }

            if (o.x < -40) {
                obstacles.splice(i, 1);
                score++;
                scoreEl.innerText = "分數: " + score;
                speed += 0.15; 

                // 每到 10 的倍數放煙火
                if (score > 0 && score % 10 === 0) {
                    createFirework(300, 100);
                }
            }
        }

        // 處理煙火粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
            if (p.life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
