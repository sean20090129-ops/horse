<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬年大發</title>
    <style>
        body { text-align: center; background: #fdf5e6; margin: 0; font-family: sans-serif; overflow: hidden; }
        canvas { background: white; border-bottom: 5px solid #d32f2f; margin-top: 20px; touch-action: none; max-width: 100%; }
        #score { font-size: 30px; color: #d32f2f; margin: 10px; font-weight: bold; }
    </style>
</head>
<body onclick="handleClick()" onkeydown="handleKey(event)">

    <h1>🐎 2026 馬到成功</h1>
    <div id="score">分數: 0</div>
    <canvas id="gameCanvas" width="600" height="200"></canvas>
    <p>點擊跳躍！每 10 分會大噴錢喔！💰</p>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    // --- 1. 載入你的手繪圖片 ---
    let imagesLoaded = 0;
    const totalImages = 2; 
    let isLooping = false; 

    const horseImg = new Image();
    horseImg.src = 'LS20260217032847.png'; // 你的手繪馬
    horseImg.onload = () => { imagesLoaded++; checkAllLoaded(); };
    horseImg.onerror = () => { console.log("馬圖片讀取失敗"); imagesLoaded++; checkAllLoaded(); };

    const giftImg = new Image();
    giftImg.src = 'redpacket.png'; // 你的紅包圖
    giftImg.onload = () => { imagesLoaded++; checkAllLoaded(); };
    giftImg.onerror = () => { imagesLoaded++; checkAllLoaded(); };

    function checkAllLoaded() {
        if (imagesLoaded >= totalImages && !isLooping) {
            isLooping = true;
            requestAnimationFrame(loop);
        }
    }

    // --- 噴錢系統 ---
    let particles = [];
    function createMoneyShower(x, y) {
        const moneyIcons = ["💰", "🪙", "💵", "🧧", "✨"]; 
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 12, 
                vy: (Math.random() - 2) * 6,    
                icon: moneyIcons[Math.floor(Math.random() * moneyIcons.length)],
                life: 80,
                size: Math.random() * 15 + 20,
                gravity: 0.25
            });
        }
    }

    // --- 遊戲設定 ---
    let score = 0;
    let isGameOver = false;
    let horseY = 140;
    let horseDy = 0;
    let gravity = 0.6;
    let grounded = true;
    let obstacles = [];
    let timer = 0;
    let startSpeed = 3; 
    let speed = startSpeed;

    function doJump() {
        if (grounded) {
            horseDy = -13;
            grounded = false;
        }
    }

    function handleClick() {
        if (isGameOver) reset();
        else doJump();
    }

    function handleKey(e) {
        if (e.code === "Space") {
            e.preventDefault();
            handleClick();
        }
    }

    function reset() {
        score = 0;
        isGameOver = false;
        horseY = 140;
        horseDy = 0;
        obstacles = [];
        particles = [];
        speed = startSpeed;
        scoreEl.innerText = "分數: 0";
        if (!isLooping) {
            isLooping = true;
            requestAnimationFrame(loop);
        }
    }

    function loop() {
        if (isGameOver) {
            isLooping = false;
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 馬的物理
        horseDy += gravity;
        horseY += horseDy;
        if (horseY > 140) { horseY = 140; horseDy = 0; grounded = true; }

        // --- 畫你的手繪馬 ---
        if (horseImg.complete && horseImg.naturalWidth !== 0) {
            ctx.drawImage(horseImg, 50, horseY, 60, 60);
        } else {
            // 萬一圖片沒出來才用 Emoji 墊檔
            ctx.font = "50px Arial";
            ctx.fillText("🐎", 50, horseY + 45);
        }

        // 障礙物生成
        timer++;
        if (timer > (1000 / speed)) { 
            const type = Math.random() > 0.3 ? 'gift' : 'firecracker';
            obstacles.push({ x: 600, w: 30, h: 30, type: type });
            timer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.x -= speed;
            
            if (o.type === 'gift') {
                if (giftImg.complete && giftImg.naturalWidth !== 0) {
                    ctx.drawImage(giftImg, o.x, 165, 30, 30);
                } else {
                    ctx.font = "30px Arial";
                    ctx.fillText("🧧", o.x, 190);
                }
            } else {
                ctx.font = "30px Arial";
                ctx.fillText("🧨", o.x, 190);
            }

            // 碰撞判定
            if (o.x < 85 && o.x > 35 && horseY > 110) {
                isGameOver = true;
                isLooping = false;
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0,0,600,200);
                ctx.fillStyle = "white";
                ctx.font = "24px Microsoft JhengHei";
                ctx.textAlign = "center";
                ctx.fillText("大吉大利，下次努力！按此重來", 300, 100);
                return;
            }

            if (o.x < -40) {
                obstacles.splice(i, 1);
                score++;
                scoreEl.innerText = "分數: " + score;
                speed += 0.15; 

                // 每 10 分大噴錢
                if (score > 0 && score % 10 === 0) {
                    createMoneyShower(300, 100);
                }
            }
        }

        // 畫出噴錢動畫
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.vx *= 0.99; 
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.font = `${p.size}px Arial`;
            ctx.fillText(p.icon, p.x, p.y);
            if (p.life <= 0 || p.y > 250) particles.splice(i, 1);
        }

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
